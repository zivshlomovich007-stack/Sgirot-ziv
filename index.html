// Role types for closures. "counts" = does it add to total fairness by default.

  t23:     { label:"צ״23",         color:"#60a5fa", needsSamal:false, counts:true },

  konan:   { label:"כונן בית",     color:"#fb923c", needsSamal:false, counts:false }, // counts only if activated
  kk:      { label:"מפקד כ״כ",     color:"#fcd34d", needsSamal:false, counts:true },
  mkBoker: { label:"מקוצרת בוקר",  color:"#a78bfa", needsSamal:false, counts:false },
  mkErev:  { label:"מקוצרת ערב",   color:"#c084fc", needsSamal:false, counts:false },
  custom:  { label:"אחר (הקלד)",   color:"#f472b6", needsSamal:false, counts:true }  // free-text location
};
const ROLE_ORDER = ["atlit","t23","sadat","konan","kk","mkBoker","mkErev","custom"];
const ROLE_SIZES = { atlit:[1,2,3,4], t23:[1,2], sadat:[1,2,3], konan:[1,2], kk:[1], mkBoker:[1,2,3], mkErev:[1,2,3], custom:[1,2,3,4] };
function defaultSize(role){ return (ROLE_SIZES[role]&&ROLE_SIZES[role][0]) || 1; }
function slotLabel(sl){
  if(sl.role==="custom") return sl.label || "אחר";
  if(sl.role==="kk") return (sl.kkType==="mkutz") ? "מקוצרת" : "מפקד כ״כ";

// hidden:true = לא מוצג באתר, אבל נשאר בהיסטוריה (כדי לא לפגוע בסגירות קיימות)
const FIGHTERS = [
  { id:"shlomowich", name:"שלומוביץ", role:"סמל, מכונה", isSamal:true,  active:true  },
  { id:"maimon",     name:"מימון",    role:"סמל", isSamal:true,  active:false, hidden:true },
  { id:"barkai",     name:"ברקאי",    role:"סמל, נגב", isSamal:true,  active:false, hidden:true },

  { id:"vaknin",     name:"וקנין",    role:"סמל", isSamal:false, active:false },

  { id:"maayan",     name:"מעיין",    role:"all around player", isSamal:false, active:false, hidden:true },
  { id:"aviya",      name:"אביה",     role:"מתשאל", isSamal:false, active:true  },
  { id:"gal",        name:"גל",       role:"חובש", isSamal:false, active:true  },

];

const HISTORY = [
  { id:1, date:"04-06.06", kk:null,   atlit:["gal","moshe"],         t23:["shamai"], mkKK:null,    blocked:[] },
  { id:2, date:"11-13.06", kk:"full", atlit:["maimon","aviya"],      t23:["biki"],   mkKK:"avni",  blocked:[] },
  { id:3, date:"18-20.06", kk:null,   atlit:["shlomowich","maayan"], t23:["vaknin"], mkKK:null,    blocked:[] },

];

// ---- state ----
let fighters = FIGHTERS.slice();
let history = HISTORY.slice();
let view = "main";
let isAdmin = false;
let blocked = [];
let toast = null;
let pwd = "";
let pwdErr = false;
let loaded = false;

var localVersion = 0, cloudVersion = 0, pendingLocalWrite = false;
function saveLocal(){
  try { localStorage.setItem("rotationData", JSON.stringify({fighters:fighters, history:history, version:localVersion, pending:pendingLocalWrite})); } catch(e){}
}
function loadLocal(){
  try {
    var raw = localStorage.getItem("rotationData");
    if(raw){ var d=JSON.parse(raw); if(d.fighters) fighters=d.fighters; if(d.history) history=d.history; if(d.version) localVersion=d.version; if(d.pending) pendingLocalWrite=true; return true; }
  } catch(e){}
  return false;
}

let editId = null;
let bSlots = [];
let bDate = "";
let bKonanActivated = false;
let bIsOp = false, bOpSize = null;
let replaceCtx = null;
let whyCtx = null;
let statsExpanded = {};
let opDate = "";
let opSize = "full";
let opPeople = [];

// ---- roster migration (non-destructive) ----
// מוסיף לוחמים חדשים מהקוד ומסתיר לוחמים שסומנו hidden. לא נוגע בהיסטוריה.
function migrateRoster(){
  var changed=false;
  FIGHTERS.forEach(function(cf){
    var ex=fighters.find(function(f){return f.id===cf.id;});
    if(!ex){ fighters=fighters.concat([Object.assign({},cf)]); changed=true; }
    else if(cf.hidden && !ex.hidden){
      fighters=fighters.map(function(f){return f.id===cf.id?Object.assign({},f,{hidden:true,active:false}):f;});
      changed=true;
    }
  });
  return changed;
}

// ---- firebase sync ----
function syncFightersFromCode(){
  fighters = FIGHTERS.map(function(f){ return Object.assign({}, f); });
  pushToCloud();
  showToast("רשימת הלוחמים עודכנה");
  render();
}

function pushToCloud() {
  var v = Date.now();
  if(v <= localVersion) v = localVersion + 1;
  localVersion = v;
  pendingLocalWrite = true;
  saveLocal();
  if(!fbOK || !DOC){ return; }
  try {
    // JSON round-trip מסיר שדות undefined (Firestore לא מקבל אותם)
    var payload = JSON.parse(JSON.stringify({ fighters: fighters, history: history, version: localVersion }));
    DOC.set(payload)
       .then(function(){ cloudVersion = localVersion; })
       .catch(function(e){ console.error("save error", e); pendingLocalWrite = true; });
  } catch(e){ console.error("save error", e); pendingLocalWrite = true; }
}

var _fbTries = 0;
function connectFirebase(){
  try {
    if(typeof firebase === "undefined" || !firebase.firestore){
      _fbTries++;
      if(_fbTries <= 60){ setTimeout(connectFirebase, 300); return; }
      console.warn("Firebase SDK not loaded after retries, local only");
      return;
    }
    if(fbOK) return;
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    db = firebase.firestore();
    DOC = db.collection("rotation").doc("main");
    fbOK = true;
    DOC.onSnapshot(function(snap){
      if(snap.exists){
        var data = snap.data();
        var incomingVer = data.version || 0;
        if(incomingVer >= localVersion){
          if(data.fighters) fighters = data.fighters;
          if(data.history) history = data.history;
          cloudVersion = incomingVer;
          localVersion = incomingVer;
          pendingLocalWrite = false;
          saveLocal();
          if(migrateRoster()){ pushToCloud(); }
        } else {
          if(pendingLocalWrite){ pushToCloud(); }
          loaded = true; render();
          return;
        }
      } else {
        pushToCloud();
      }
      loaded = true;
      render();
    }, function(err){
      console.error("snapshot error", err);
    });
  } catch(e) {
    console.error("Firebase connect failed, using local data", e);
    fbOK = false;
  }
}

// ---- logic ----
function endDateOf(s){
  try{
    s=String(s);
    var m=s.match(/\d{1,2}\/\d{1,2}\/\d{4}/g);
    if(m){
      var q=m[m.length-1].split("/");
      var dd=parseInt(q[0],10), mo=parseInt(q[1],10), yy=parseInt(q[2],10);
      if(mo<1||mo>12||dd<1||dd>31) return null;
      return new Date(yy, mo-1, dd, 23,59,59);
    }
    var p=s.split("."); var dd=p[0].split("-"); var last=parseInt(dd[dd.length-1],10);
    return new Date(YEAR, parseInt(p[1],10)-1, last, 23,59,59);
  }catch(e){ return null; }
}
function validDate(s){ var d=endDateOf(s); return !!d && !isNaN(d.getTime()); }
function isPast(s){ var d=endDateOf(s); return d ? d.getTime()<Date.now() : false; }

function calcCounts(hist){
  var c={};
  fighters.forEach(function(f){ c[f.id]={total:0,atlit:0,t23:0,sadat:0,konan:0,kk:0,mkKK:0,mkutz:0,op:0,opMorning:0,opEvening:0,mkBoker:0,mkErev:0}; });
  (hist||[]).forEach(function(w){
    if(!w) return;
    if(w.type==="op"){
      (w.people||[]).forEach(function(id){
        if(!c[id]) return;
        c[id].op++;
        if(w.opSize==="full"){ c[id].total++; }
        if(w.opSize==="sat_morning"){ c[id].opMorning++; }
        if(w.opSize==="sat_evening"){ c[id].opEvening++; }
      });
      return;
    }
    weekSlots(w).forEach(function(sl){
      var rdef = ROLES[sl.role] || {counts:true};
      (sl.people||[]).forEach(function(id){
        if(!c[id]) return;
        if(c[id][sl.role]!==undefined) c[id][sl.role]++;
        if(sl.role==="kk") c[id].mkKK++;
        if(sl.role==="kk"){
          if((sl.kkType||"full")==="full"){ c[id].total++; }
          else { c[id].mkutz++; }
        } else if(sl.role==="konan"){
          if(w.konanActivated){ c[id].total++; }
        } else if(sl.role==="mkBoker"){
          c[id].opMorning++;
        } else if(sl.role==="mkErev"){
          c[id].opEvening++;
        } else if(rdef.counts){
          c[id].total++;
        }
      });
    });
  });
  return c;
}
function lastMkutz(hist){
  var s=hist.slice().sort(function(a,b){return b.id-a.id;});
  for(var i=0;i<s.length;i++){
    var sl=weekSlots(s[i]).filter(function(x){return x.role==="kk"&&(x.kkType||"full")==="mkutz";})[0];
    if(sl) return sl.people[0];
    if(i===0) break;
  }
  return null;
}
function prevWeekendIds(hist){
  var s=hist.slice().sort(function(a,b){var da=endDateOf(a.date),db=endDateOf(b.date);return (db?db.getTime():0)-(da?da.getTime():0);});
  if(s.length===0) return [];
  var w=s[0];
  if(w.type==="op") return (w.people||[]).slice();
  var ids=[];
  weekSlots(w).forEach(function(sl){
    if(sl.role==="konan" && !w.konanActivated) return;
    if(sl.role==="mkBoker" || sl.role==="mkErev") return;
    ids=ids.concat(sl.people);
  });
  return ids;
}
function earlyReturnIds(hist){
  var s=hist.slice().sort(function(a,b){var da=endDateOf(a.date),db=endDateOf(b.date);return (db?db.getTime():0)-(da?da.getTime():0);});
  var recent = s.filter(function(w){return w.type==="op"&&(w.opSize==="sat_morning"||w.opSize==="sat_evening");});
  return recent.length? (recent[0].people||[]).slice() : [];
}

function recommendForSlot(hist, role, taken, avoid){
  var counts=calcCounts(hist);
  var needsSamal = ROLES[role] && ROLES[role].needsSamal;
  var pool=fighters.filter(function(f){
    if(!f.active) return false;
    if(taken.indexOf(f.id)!==-1) return false;
    if(blocked.indexOf(f.id)!==-1) return false;
    return true;
  });
  var reserveSamal = !needsSamal;
  pool.sort(function(a,b){
    var t=counts[a.id].total-counts[b.id].total;
    if(t!==0) return t;
    var ra=avoid.indexOf(a.id)!==-1?1:0, rb=avoid.indexOf(b.id)!==-1?1:0;
    if(ra!==rb) return ra-rb;
    if(reserveSamal){ var sa=a.isSamal?1:0,sb=b.isSamal?1:0; if(sa!==sb) return sa-sb; }
    return (counts[a.id][role]||0)-(counts[b.id][role]||0);
  });
  if(needsSamal){
    var hasSamal = taken.some(function(id){ return F(id)&&F(id).isSamal; });
    if(!hasSamal){
      var samals=pool.filter(function(f){return f.isSamal;});
      var rest=pool.filter(function(f){return !f.isSamal;});
      pool=samals.concat(rest);
    }
  }
  return pool;
}

function slotReason(f, hist, role, avoid){
  var counts=calcCounts(hist);
  var c=counts[f.id]||{total:0};
  var parts=[];
  parts.push(c.total+" סגירות בסה״כ");
  if(avoid.indexOf(f.id)!==-1){ parts.push("סגר לאחרונה — עדיף לנוח"); }
  else { parts.push("לא סגר בסופ״ש האחרון"); }
  if(ROLES[role] && !ROLES[role].needsSamal && f.isSamal){ parts.push("סמל — עדיף לשמור לצ צפון"); }
  var inRole=c[role]||0;
  if(inRole>0) parts.push("עשה "+inRole+" פעמים בתפקיד זה");
  var shorts=(c.mkutz||0)+(c.opMorning||0)+(c.opEvening||0);
  if(shorts>0) parts.push(shorts+" מקוצרות/חזרות מוקדמות");
  return parts;
}
function slotReasonShort(f, hist, role, avoid){
  var counts=calcCounts(hist);
  var c=counts[f.id]||{total:0};
  var bits=[c.total+" סגירות"];
  if(avoid.indexOf(f.id)!==-1) bits.push("סגר לאחרונה");
  return bits.join(" · ");
}
function F(id){ return fighters.find(function(f){return f.id===id;}); }

function weekSlots(w){
  if(!w) return [];
  if(w.slots && Array.isArray(w.slots)){
    return w.slots.filter(function(sl){ return sl && sl.role; }).map(function(sl){
      var o={ role:sl.role, people:Array.isArray(sl.people)?sl.people.filter(Boolean):[], kkType:sl.kkType };
      if(sl.label) o.label=sl.label;
      return o;
    });
  }
  var s=[];
  if(w.atlit && w.atlit.length) s.push({role:"atlit", people:w.atlit.filter(Boolean)});
  if(w.t23 && w.t23.length)     s.push({role:"t23",   people:w.t23.filter(Boolean)});
  if(w.mkKK)                    s.push({role:"kk",     people:[w.mkKK], kkType:w.kk||"full"});
  return s;
}
function weekPeople(w){
  if(!w) return [];
  if(w.type==="op") return Array.isArray(w.people)?w.people.filter(Boolean):[];
  var ids=[];
  weekSlots(w).forEach(function(sl){ ids=ids.concat(sl.people); });
  return ids;
}

function replacementCandidates(week, role, oldId){
  var others = history.filter(function(x){ return x.id!==week.id; });
  var counts = calcCounts(others);
  var before = history.filter(function(x){ var d=endDateOf(x.date), wd=endDateOf(week.date); return d&&wd&&d.getTime()<wd.getTime(); });
  var recent = prevWeekendIds(before);
  var inWeek = weekPeople(week);
  var pool = fighters.filter(function(f){
    if(!f.active) return false;
    if(f.id===oldId) return false;
    if(inWeek.indexOf(f.id)!==-1) return false;
    return true;
  });
  if(ROLES[role] && ROLES[role].needsSamal){
    var slot = weekSlots(week).filter(function(sl){return sl.role===role;})[0];
    var otherSamal = slot && slot.people.some(function(id){ return id!==oldId && F(id) && F(id).isSamal; });
    if(!otherSamal){ pool = pool.filter(function(f){ return f.isSamal; }); }
  }
  var roleKey = role==="mkKK" ? "kk" : role;
  var reserveSamal = !(ROLES[role] && ROLES[role].needsSamal);
  pool.sort(function(a,b){
    var t = counts[a.id].total - counts[b.id].total;
    if(t!==0) return t;
    var ra = recent.indexOf(a.id)!==-1?1:0, rb = recent.indexOf(b.id)!==-1?1:0;
    if(ra!==rb) return ra-rb;
    if(reserveSamal){
      var sa=a.isSamal?1:0, sb=b.isSamal?1:0;
      if(sa!==sb) return sa-sb;
    }
    return (counts[a.id][roleKey]||0) - (counts[b.id][roleKey]||0);
  });
  return pool;
}

function doReplace(newId){
  if(!replaceCtx) return;
  var wid=replaceCtx.weekId, oldId=replaceCtx.oldId;
  history=history.map(function(w){
    if(w.id!==wid) return w;
    var slots = weekSlots(w).map(function(sl){
      var o={ role:sl.role, people:sl.people.map(function(id){return id===oldId?newId:id;}), kkType:sl.kkType };
      if(sl.label) o.label=sl.label;
      return o;
    });
    var nw=Object.assign({},w,{slots:slots});
    delete nw.atlit; delete nw.t23; delete nw.mkKK; delete nw.kk;
    return nw;
  });
  replaceCtx=null;
  pushToCloud();
  showToast("החלפה בוצעה");
  render();
}

function opRecommendation(){
  var counts=calcCounts(history);
  var avoid = prevWeekendIds(history).concat(earlyReturnIds(history));
  var pool=fighters.filter(function(f){return f.active;});
  pool.sort(function(a,b){
    var t=counts[a.id].total-counts[b.id].total;
    if(t!==0) return t;
    var ra=avoid.indexOf(a.id)!==-1?1:0, rb=avoid.indexOf(b.id)!==-1?1:0;
    if(ra!==rb) return ra-rb;
    return 0;
  });
  return pool;
}
function toggleOpPerson(id){
  opPeople = opPeople.indexOf(id)!==-1 ? opPeople.filter(function(x){return x!==id;}) : opPeople.concat([id]);
  render();
}
function saveOp(){
  if(!opDate){ showToast("הכנס תאריך"); return; }
  if(!validDate(opDate)){ showToast("תאריך לא תקין (למשל 26/07/2026)"); return; }
  if(opPeople.length===0){ showToast("בחר לוחמים"); return; }
  var w={ id:Date.now(), type:"op", date:opDate, opSize:opSize, people:opPeople.slice() };
  history=history.concat([w]);
  opDate=""; opSize="full"; opPeople=[];
  pushToCloud();
  showToast("פעילות מבצעית נשמרה");
  view="planned"; render();
}

// ---- actions ----
function showToast(m){ toast=m; render(); setTimeout(function(){toast=null;render();},2500); }
function tryLogin(){ if(pwd===PWD){isAdmin=true;view="main";pwd="";render();} else {pwdErr=true;pwd="";render();setTimeout(function(){pwdErr=false;render();},1500);} }
function editWeek(id){
  var w=history.find(function(x){return x.id===id;});
  if(!w) return;
  editId=id; bDate=w.date;
  bKonanActivated = !!w.konanActivated;
  if(w.type==="op"){
    bIsOp = true; bOpSize = w.opSize || "full";
    var opRole = (w.opSize==="sat_morning") ? "mkBoker" : (w.opSize==="sat_evening") ? "mkErev" : "t23";
    bSlots = [{ role:opRole, people:(w.people||[]).slice() }];
  } else {
    bIsOp = false; bOpSize = null;
    bSlots = weekSlots(w).map(function(sl){
      var o={role:sl.role, people:sl.people.slice(), kkType:sl.kkType||"full"};
      if(sl.label) o.label=sl.label;
      return o;
    });
  }
  blocked=(w.blocked||[]).slice();
  view="build"; render();
}

// ---- flexible builder ----
function ensureBuilderReady(){
  editId=null; bKonanActivated=false; bIsOp=false; bOpSize=null;
  if(!bDate) bDate = nextFreeWeekend();
  bSlots = [ {role:"t23",people:[]} ];
  autoFillBuild();
}
function newBuild(){
  editId=null; bDate=nextFreeWeekend(); bKonanActivated=false; bIsOp=false; bOpSize=null; blocked=[];
  bSlots=[ {role:"t23",people:[]} ];
  autoFillBuild();
  view="build"; render();
}
function bAvoid(){
  var ex = editId!==null ? history.filter(function(x){return x.id!==editId;}) : history;
  var target = endDateOf(bDate);
  if(target){
    var before = ex.filter(function(x){ var d=endDateOf(x.date); return d && d.getTime() < target.getTime(); });
    if(before.length){
      return prevWeekendIds(before).concat(earlyReturnIds(before));
    }
  }
  return prevWeekendIds(ex).concat(earlyReturnIds(ex));
}
function bHist(){
  var ex = editId!==null ? history.filter(function(x){return x.id!==editId;}) : history;
  var target = endDateOf(bDate);
  if(target){
    return ex.filter(function(x){ var d=endDateOf(x.date); return !d || d.getTime() <= target.getTime(); });
  }
  return ex;
}
function autoFillBuild(){
  var taken=[];
  bSlots.forEach(function(sl){ sl.people.forEach(function(p){ if(p) taken.push(p); }); });
  bSlots.forEach(function(sl){
    var want = sl.people.length>0 ? sl.people.length : defaultSize(sl.role);
    if(sl.people.filter(Boolean).length===0){
      var rec=recommendForSlot(bHist(), sl.role, taken, bAvoid());
      sl.people=[];
      for(var i=0;i<want && i<rec.length;i++){ sl.people.push(rec[i].id); taken.push(rec[i].id); }
    } else {
      sl.people.forEach(function(p){ if(p) taken.push(p); });
    }
  });
}
function addSlot(role){
  var n=defaultSize(role);
  var ppl=[]; for(var i=0;i<n;i++) ppl.push(null);
  var sl={role:role, people:ppl, kkType:(role==="kk"?"full":undefined)};
  if(role==="custom") sl.label="";
  bSlots.push(sl);
  var taken=[];
  bSlots.forEach(function(s){ s.people.forEach(function(p){ if(p) taken.push(p); }); });
  var rec=recommendForSlot(bHist(), role, taken, bAvoid());
  for(var j=0;j<n && j<rec.length;j++){ sl.people[j]=rec[j].id; }
  render();
}
function removeSlot(idx){ bSlots.splice(idx,1); render(); }
function setSlotSize(sIdx, n){
  var sl=bSlots[sIdx];
  var cur=sl.people.length;
  if(n>cur){
    var taken=[];
    bSlots.forEach(function(s){ s.people.forEach(function(p){ if(p) taken.push(p); }); });
    var rec=recommendForSlot(bHist(), sl.role, taken, bAvoid());
    var ri=0;
    while(sl.people.length<n){
      var pick=null;
      while(ri<rec.length){ if(taken.indexOf(rec[ri].id)===-1){ pick=rec[ri].id; ri++; break; } ri++; }
      sl.people.push(pick); if(pick) taken.push(pick);
    }
  } else if(n<cur){
    sl.people = sl.people.slice(0,n);
  }
  render();
}
function removePersonFromSlot(sIdx, pIdx){ bSlots[sIdx].people.splice(pIdx,1); render(); }
function setSlotPerson(sIdx, pIdx, id){ bSlots[sIdx].people[pIdx] = id || null; render(); }
function setSlotKkType(sIdx, t){ bSlots[sIdx].kkType=t; render(); }
function recommendSlotPerson(sIdx, pIdx){
  var taken=[];
  bSlots.forEach(function(sl,i){ sl.people.forEach(function(p,j){ if(p && !(i===sIdx&&j===pIdx)) taken.push(p); }); });
  var rec=recommendForSlot(bHist(), bSlots[sIdx].role, taken, bAvoid());
  if(rec.length){ bSlots[sIdx].people[pIdx]=rec[0].id; render(); }
}
function saveBuild(){
  if(!bDate){ showToast("הכנס תאריך"); return; }
  if(!validDate(bDate)){ showToast("תאריך לא תקין (למשל 26/07/2026)"); return; }
  var slots = bSlots.map(function(sl){
    var o={ role:sl.role, people:sl.people.filter(Boolean), kkType:sl.kkType };
    if(sl.role==="custom") o.label=(sl.label||"").trim()||"אחר";
    return o;
  }).filter(function(sl){ return sl.people.length>0; });
  if(slots.length===0){ showToast("בחר לפחות לוחם אחד"); return; }
  var hasKonan = slots.some(function(sl){return sl.role==="konan";});
  var w={ id: (editId!==null?editId:Date.now()), date:bDate, slots:slots, blocked:blocked.slice() };
  if(hasKonan) w.konanActivated = bKonanActivated;
  if(editId!==null){
    history=history.map(function(x){ return x.id===editId ? w : x; });
  } else {
    history=history.concat([w]);
  }
  editId=null; bSlots=[]; bDate=""; blocked=[]; bKonanActivated=false;
  pushToCloud();
  showToast("נשמר");
  view="planned"; render();
}

function nextFreeWeekend(){
  var taken = {};
  history.forEach(function(w){ var d=endDateOf(w.date); if(d) taken[d.toDateString()]=true; });
  var cur = new Date();
  cur.setHours(0,0,0,0);
  for(var i=0;i<120;i++){
    var day = new Date(cur.getTime() + i*86400000);
    if(day.getDay()===4){
      var sat = new Date(day.getTime() + 2*86400000);
      sat.setHours(23,59,59,0);
      if(!taken[sat.toDateString()]){
        var dd=function(n){ return (n<10?"0":"")+n; };
        return dd(sat.getDate())+"/"+dd(sat.getMonth()+1)+"/"+sat.getFullYear();
      }
    }
  }
  return "";
}

function deleteWeek(id){ history=history.filter(function(x){return x.id!==id;}); pushToCloud(); render(); }
function confirmDelete(id){
  var w=history.find(function(x){return x.id===id;});

  if(window.confirm("למחוק את הסגירה "+label+"?")){
    deleteWeek(id);
    showToast("הסגירה נמחקה");

}

function renderMain(counts,prev,plannedWeeks){
  var h='';
  var sortedPlanned = plannedWeeks.slice().sort(function(a,b){ var da=endDateOf(a.date),db=endDateOf(b.date); return (da?da.getTime():0)-(db?db.getTime():0); });
  if(sortedPlanned.length>0){
    h+=plannedCard(sortedPlanned[0], "הסופ״ש הקרוב", true);
    if(sortedPlanned[1]) h+=plannedCard(sortedPlanned[1], "הסופ״ש הבא", false);
    h+='<div style="height:8px;"></div>';
  }
  if(isAdmin){
    if(bSlots.length===0 && editId===null){ ensureBuilderReady(); }
    h+=renderBuild();
  }
  h+='<div style="background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px;">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><p style="font-weight:600;font-size:14px;margin:0;color:var(--text);">לוחמים</p>';
  if(isAdmin) h+='<button onclick="__a.syncFightersFromCode()" style="font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted2);cursor:pointer;">עדכן שמות/תגים</button>';
  h+='</div>';
  var fightersSorted = fighters.filter(function(f){return !f.hidden;}).sort(function(a,b){ if(a.active!==b.active) return a.active?-1:1; return 0; });
  fightersSorted.forEach(function(f){
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid '+(f.active?"var(--line2)":"var(--surface2)")+';background:'+(f.active?"rgba(39,39,42,0.5)":"rgba(24,24,27,0.3)")+';margin-bottom:6px;opacity:'+(f.active?1:0.5)+';">';
    if(isAdmin) h+='<button onclick="__a.toggleActive(\''+f.id+'\')" style="width:16px;height:16px;border-radius:4px;border:1px solid '+(f.active?"#10b981":"var(--faint)")+';background:'+(f.active?"#10b981":"transparent")+';display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--text);font-size:11px;padding:0;">'+(f.active?"v":"")+'</button>';
    h+='<span style="font-size:14px;font-weight:500;color:'+(f.active?"var(--text)":"var(--faint)")+';">'+esc(f.name)+'</span>';
    if(f.role) h+='<span style="font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 6px;border-radius:4px;">'+esc(f.role)+'</span>';
    if(f.id===prev) h+='<span style="font-size:11px;color:#d8b4fe;background:rgba(88,28,135,0.3);padding:2px 6px;border-radius:4px;border:1px solid rgba(107,33,168,0.5);">מקוצרת</span>';
    h+='<span style="margin-right:auto;font-size:12px;color:var(--faint);font-family:Secular One,sans-serif;">'+(counts[f.id]?counts[f.id].total:0)+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function renderWeeks(weeks,planned){
  var h='<div>';
  h+='<h2 style="font-weight:600;margin:0 0 4px;color:var(--text);">'+(planned?"סגירות מתוכננות":"היסטוריה")+'</h2>';
  if(planned) h+='<p style="color:var(--muted);font-size:12px;margin:0 0 12px;">סגירות שאושרו קדימה. יעברו להיסטוריה אוטומטית אחרי שיעברו</p>';
  if(planned&&isAdmin){
    h+='<div style="display:flex;gap:8px;margin-bottom:12px;">';
    h+='<button onclick="__a.newWeek()" style="flex:1;padding:10px;background:var(--gold);color:#1c1917;border-radius:8px;font-size:13px;font-weight:bold;border:none;cursor:pointer;">+ סגירת בט״ש</button>';
    h+='<button onclick="__a.openOp()" style="flex:1;padding:10px;background:#b45309;color:var(--text);border-radius:8px;font-size:13px;font-weight:bold;border:none;cursor:pointer;">+ פעילות מבצעית</button>';
    h+='</div>';
  }
  else h+='<div style="height:8px;"></div>';
  if(weeks.length===0) h+='<div style="background:var(--card);border-radius:14px;border:1px solid var(--line);padding:24px;text-align:center;"><p style="color:var(--faint);font-size:14px;margin:0;">'+(planned?"אין סגירות מתוכננות":"אין היסטוריה")+'</p></div>';
  weeks.forEach(function(w){
    if(w.type==="op"){
      h+='<div style="background:var(--card);border-radius:14px;border:1px solid #b45309;padding:16px;margin-bottom:12px;">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
      h+='<span style="font-weight:bold;font-size:14px;color:var(--gold);">פעילות מבצעית · '+esc(w.date)+'</span><div style="display:flex;gap:6px;align-items:center;">';
      h+='<span style="font-size:11px;color:#fcd34d;background:rgba(120,53,15,0.4);border:1px solid rgba(146,64,14,0.5);padding:2px 8px;border-radius:6px;">'+(OP_LABELS[w.opSize]||w.opSize)+'</span>';
      if(isAdmin) h+='<button onclick="__a.confirmDelete('+w.id+')" style="background:none;border:1px solid var(--line2);border-radius:6px;color:#f87171;font-size:12px;cursor:pointer;padding:3px 8px;">מחק</button>';
      h+='</div></div>';
      h+='<div style="font-size:14px;color:var(--text);"><span style="color:var(--gold);font-size:12px;">משתתפים: </span>'+esc(namesOf(w.people))+'</div>';
      h+='</div>';
      return;
    }
    h+='<div style="background:var(--card);border-radius:14px;border:1px solid '+(planned?"var(--line2)":"var(--surface2)")+';padding:16px;margin-bottom:12px;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    h+='<span style="font-weight:bold;font-size:14px;color:'+(planned?"var(--gold)":"var(--text)")+';">'+esc(w.date)+'</span><div style="display:flex;gap:6px;align-items:center;">';
    if(w.kk==="full") h+='<span style="font-size:11px;color:#fcd34d;background:rgba(120,53,15,0.4);border:1px solid rgba(146,64,14,0.5);padding:2px 8px;border-radius:6px;">כ״כ מלא</span>';
    if(w.kk==="mkutz") h+='<span style="font-size:11px;color:#d8b4fe;background:rgba(88,28,135,0.4);border:1px solid rgba(107,33,168,0.5);padding:2px 8px;border-radius:6px;">מקוצרת</span>';
    if(w.blocked&&w.blocked.length>0) h+='<span style="font-size:11px;color:#f87171;background:rgba(127,29,29,0.4);border:1px solid rgba(153,27,27,0.5);padding:2px 8px;border-radius:6px;">'+w.blocked.length+' בקשצ</span>';
    if(isAdmin) h+='<button onclick="__a.editWeek('+w.id+')" style="background:none;border:1px solid var(--line2);border-radius:6px;color:#60a5fa;font-size:12px;cursor:pointer;padding:3px 8px;">ערוך</button>';
    if(isAdmin) h+='<button onclick="__a.confirmDelete('+w.id+')" style="background:none;border:1px solid var(--line2);border-radius:6px;color:#f87171;font-size:12px;cursor:pointer;padding:3px 8px;">מחק</button>';
    h+='</div></div><div style="font-size:14px;color:var(--text);">';
    var canReplace = planned && isAdmin;
    function nameWithBtn(id, role){
      var nm = F(id)?F(id).name:id;
      var s = '<span style="display:inline-flex;align-items:center;gap:4px;margin-left:8px;white-space:nowrap;">'+esc(nm);
      if(canReplace){
        s += '<button onclick="__a.openReplace('+w.id+',\''+role+'\',\''+id+'\')" style="background:none;border:1px solid var(--line2);border-radius:5px;color:var(--gold);font-size:10px;cursor:pointer;padding:1px 5px;">החלף</button>';
      }
      s += '</span>';
      return s;
    }
    weekSlots(w).forEach(function(sl){
      var rdef=ROLES[sl.role]||{label:sl.role,color:"var(--muted2)"};
      h+='<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;flex-wrap:wrap;"><span style="color:'+rdef.color+';font-size:12px;width:75px;flex-shrink:0;">'+esc(slotLabel(sl))+'</span><span>'+sl.people.map(function(id){return nameWithBtn(id,sl.role);}).join("")+'</span></div>';
    });
    if(weekSlots(w).some(function(sl){return sl.role==="konan";})){
      var _act=!!w.konanActivated;
      h+='<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:12px;color:#fb923c;">כונן בית:</span>';
      if(isAdmin){ h+='<button onclick="__a.toggleKonanActivated('+w.id+')" style="font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid '+(_act?"var(--ok)":"var(--line2)")+';background:'+(_act?"rgba(5,150,105,0.25)":"var(--surface2)")+';color:'+(_act?"#34d399":"var(--muted2)")+';cursor:pointer;">'+(_act?"הייתה פעילות (נספר)":"לא הייתה פעילות")+'</button>'; }
      else { h+='<span style="font-size:12px;color:'+(_act?"#34d399":"var(--muted)")+';">'+(_act?"הייתה פעילות":"טרם הופעל")+'</span>'; }
      h+='</div>';
    }
    if(w.blocked&&w.blocked.length>0) h+='<div style="display:flex;gap:8px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px;"><span style="color:#f87171;font-size:12px;width:70px;flex-shrink:0;">בקשצים</span><span style="color:var(--muted);font-size:12px;">'+esc(namesOf(w.blocked))+'</span></div>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

function renderOp(counts){
  var rec = opRecommendation();
  var avoid = prevWeekendIds(history).concat(earlyReturnIds(history));
  var sizes = [["full","סגירה מלאה"],["sat_morning","חזרה שבת בוקר"],["sat_evening","חזרה שבת ערב"],["fri","יציאה שישי"]];
  var h='<div style="background:var(--card);border-radius:14px;border:1px solid #b45309;padding:16px;margin-bottom:12px;">';
  h+='<h2 style="font-weight:600;margin:0 0 4px;color:var(--gold);">פעילות מבצעית חדשה</h2>';
  h+='<p style="color:var(--muted);font-size:12px;margin:0 0 16px;">שיבוץ ידני · כולם יוצאים באותו גודל</p>';
  h+='<div style="margin-bottom:16px;"><label style="font-size:12px;color:var(--muted2);display:block;margin-bottom:4px;">תאריך</label>';
  h+='<input id="opDateInput" type="text" value="'+esc(opDate)+'" placeholder="26/07/2026" style="width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px;outline:none;box-sizing:border-box;"></div>';
  h+='<div style="margin-bottom:16px;"><label style="font-size:12px;color:var(--muted2);display:block;margin-bottom:8px;">גודל הסגירה</label><div style="display:flex;gap:6px;flex-wrap:wrap;">';
  sizes.forEach(function(it){
    var t=it[0],l=it[1],sel=opSize===t;
    h+='<button onclick="__a.setOpSize(\''+t+'\')" style="flex:1;min-width:45%;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid '+(sel?"#b45309":"var(--line2)")+';background:'+(sel?"rgba(120,53,15,0.5)":"var(--surface2)")+';color:'+(sel?"#fcd34d":"var(--muted)")+';cursor:pointer;">'+l+'</button>';
  });
  h+='</div>';
  if(opSize==="full") h+='<p style="font-size:11px;color:var(--muted);margin:8px 0 0;">סגירה מלאה נספרת כסגירה רגילה באיזון</p>';
  else if(opSize==="sat_morning"||opSize==="sat_evening") h+='<p style="font-size:11px;color:#d8b4fe;margin:8px 0 0;">חזרה מוקדמת - לא נספרת כסגירה, אך יעדיף שלא יסגרו אחרי</p>';
  else h+='<p style="font-size:11px;color:var(--muted);margin:8px 0 0;">יציאה מוקדמת - קלה, לא משפיעה על האיזון</p>';
  h+='</div>';
  h+='<label style="font-size:12px;color:var(--muted2);display:block;margin-bottom:8px;">בחר לוחמים ('+opPeople.length+' נבחרו) · מומלץ למעלה</label>';
  rec.forEach(function(f, i){
    var sel = opPeople.indexOf(f.id)!==-1;
    var best = i<3;
    h+='<button onclick="__a.toggleOpPerson(\''+f.id+'\')" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid '+(sel?"var(--ok)":"var(--line2)")+';background:'+(sel?"rgba(5,150,105,0.15)":"rgba(39,39,42,0.4)")+';margin-bottom:6px;cursor:pointer;text-align:right;box-sizing:border-box;">';
    h+='<div style="width:18px;height:18px;border-radius:4px;border:2px solid '+(sel?"#10b981":"var(--faint)")+';background:'+(sel?"#10b981":"transparent")+';display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text);font-size:11px;font-weight:bold;">'+(sel?"v":"")+'</div>';
    h+='<span style="font-size:14px;font-weight:500;color:var(--text);">'+esc(f.name)+'</span>';
    if(f.isSamal) h+='<span style="font-size:11px;color:var(--muted);">סמל</span>';
    if(best&&!sel) h+='<span style="font-size:10px;color:#34d399;background:rgba(5,150,105,0.2);padding:1px 6px;border-radius:6px;">מומלץ</span>';
    if(avoid.indexOf(f.id)!==-1) h+='<span style="font-size:10px;color:#f87171;">סגר לאחרונה</span>';
    h+='<span style="margin-right:auto;font-size:12px;color:var(--muted2);font-family:Secular One,sans-serif;">'+(counts[f.id]?counts[f.id].total:0)+'</span>';
    h+='</button>';
  });
  var ready=(opDate&&opPeople.length>0);
  h+='<button onclick="__a.saveOp()" style="width:100%;margin-top:12px;padding:10px;background:'+(ready?"var(--ok)":"var(--surface2)")+';color:'+(ready?"var(--text)":"var(--faint)")+';border-radius:8px;font-size:14px;font-weight:bold;border:none;cursor:pointer;">שמור פעילות מבצעית</button>';
  h+='<button onclick="__a.setView(\'main\')" style="width:100%;margin-top:8px;padding:8px;background:var(--surface2);color:var(--muted2);border-radius:8px;font-size:13px;border:none;cursor:pointer;">ביטול</button>';
  h+='</div>';
  return h;
}

function fighterOptionsB(selectedId){
  var opts='<option value="">— בחר —</option>';
  fighters.filter(function(f){return f.active;}).forEach(function(f){
    opts+='<option value="'+f.id+'"'+(f.id===selectedId?' selected':'')+'>'+esc(f.name)+(f.isSamal?' (סמל)':'')+'</option>';
  });
  return opts;
}

  }
  h+='<button onclick="__a.autoFill()" style="width:100%;padding:8px;background:rgba(5,150,105,0.2);color:#34d399;border:1px solid var(--ok);border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:8px;">מלא הכל אוטומטית (לפי הוגנות)</button>';
  h+='<button onclick="__a.saveBuild()" style="width:100%;padding:10px;background:var(--ok);color:var(--text);border-radius:8px;font-size:14px;font-weight:bold;border:none;cursor:pointer;margin-bottom:8px;">שמור סגירה</button>';
  h+='<button onclick="__a.cancelEdit()" style="width:100%;padding:8px;background:var(--surface2);color:var(--muted2);border-radius:8px;font-size:13px;border:none;cursor:pointer;">ביטול</button>';
  h+='</div>';
  return h;
}

function renderStats(counts){
  var h='<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 style="font-weight:600;margin:0;color:var(--text);">סטטיסטיקות</h2>';
  h+='<span style="font-size:11px;color:var(--faint);">לחץ על לוחם לפירוט</span></div>';
  var visible=fighters.filter(function(f){return !f.hidden;});
  var sorted=visible.slice().sort(function(a,b){
    if(a.active!==b.active) return a.active ? -1 : 1;
    return (counts[b.id]?counts[b.id].total:0)-(counts[a.id]?counts[a.id].total:0);
  });
  var maxVal=Math.max.apply(null,visible.map(function(x){return counts[x.id]?counts[x.id].total:0;}).concat([1]));
  sorted.forEach(function(f){
    var c=counts[f.id]||{total:0,atlit:0,t23:0,mkKK:0,mkutz:0};
    var pct=(c.total/maxVal)*100;
    var open=!!statsExpanded[f.id];
    var totalShort = (c.mkutz||0) + (c.opMorning||0) + (c.opEvening||0);
    h+='<div style="background:var(--card);border-radius:14px;border:1px solid '+(f.active?"var(--surface2)":"var(--card)")+';padding:12px;margin-bottom:8px;opacity:'+(f.active?1:0.4)+';cursor:pointer;" onclick="__a.toggleStat(\''+f.id+'\')">';
    h+='<div style="display:flex;align-items:center;gap:8px;">';
    h+='<span style="font-size:11px;color:var(--faint);">'+(open?"▼":"◀")+'</span>';
    h+='<span style="font-size:14px;font-weight:600;color:var(--text);">'+esc(f.name)+'</span>';
    if(!f.active) h+='<span style="font-size:11px;color:var(--faint);background:var(--surface2);padding:2px 6px;border-radius:4px;">לא פעיל</span>';
    if(totalShort>0 && !open) h+='<span style="font-size:10px;color:#d8b4fe;background:rgba(88,28,135,0.3);padding:2px 6px;border-radius:4px;">'+totalShort+' מקוצרות</span>';
    h+='<span style="margin-right:auto;font-size:13px;color:var(--muted2);font-family:Secular One,sans-serif;font-weight:600;">'+c.total+'</span></div>';
    h+='<div style="height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:8px;"><div style="height:100%;width:'+pct+'%;background:var(--gold);border-radius:6px;"></div></div>';
    if(open){
      h+='<div style="display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:10px;">';
      h+='<span><span style="color:#34d399;">'+c.atlit+'</span> צ צפון</span>';
      h+='<span><span style="color:#60a5fa;">'+c.t23+'</span> צ״23</span>';
      if(c.sadat>0) h+='<span><span style="color:#22d3ee;">'+c.sadat+'</span> שדת</span>';
      if(c.kk>0) h+='<span><span style="color:var(--gold);">'+c.kk+'</span> כ״כ</span>';
      if(c.konan>0) h+='<span><span style="color:#fb923c;">'+c.konan+'</span> כונן בית</span>';
      if(c.op>0) h+='<span><span style="color:var(--gold);">'+c.op+'</span> פעילות מבצעית</span>';
      h+='</div>';
      h+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;gap:12px;font-size:12px;flex-wrap:wrap;">';
      h+='<span style="color:'+(totalShort>0?"#d8b4fe":"var(--faint)")+';font-weight:'+(totalShort>0?"600":"400")+';">מקוצרות/חזרות מוקדמות: <span style="font-family:Secular One,sans-serif;">'+totalShort+'</span></span>';
      if(c.mkutz>0) h+='<span style="color:#a855f7;">'+c.mkutz+' מקוצרת כ״כ</span>';
      if(c.opMorning>0) h+='<span style="color:#fb923c;">'+c.opMorning+' בוקר</span>';
      if(c.opEvening>0) h+='<span style="color:#fb923c;">'+c.opEvening+' ערב</span>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

// ---- startup ----
loadLocal();
if(migrateRoster()) saveLocal();
loaded = true;
render();
connectFirebase();
</script>
</body>
</html>
